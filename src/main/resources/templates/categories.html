<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${type == null ? 'All categories' : type.name() + ' categories'}">Categories</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container py-4">

    <!-- Header + Add category -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${type == null ? 'All categories' : type.name() + ' categories'}"></h2>
        <a th:href="@{/addcategory(returnUrl=${currentUrl}, entryType=${type})}" class="btn btn-primary">
            Add category
        </a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.name}"></td>
            <td th:text="${category.type}"></td>
            <td>
                <!-- Delete available only for empty categories -->
                <form th:if="${!category.global and (category.entries == null or #lists.isEmpty(category.entries))}"
                    th:action="@{/deletecategory/{id}(id=${category.category_id}, type=${type})}"
                    method="post"
                    style="display: inline;"
                    onsubmit="return confirm('Are you sure you want to delete this category?');">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Back to the same type entries -->
    <div class="mt-3">
        <a th:if="${type != null}" th:href="@{/entries(type=${type})}" class="btn btn-secondary">Back to Entries</a>
        <a th:if="${type == null}" th:href="@{/entries}" class="btn btn-secondary">Back to Entries</a>
    </div>

</div>
</body>
</html>
